services:
  - type: web
    name: enterprise-ai-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: PORT
        value: 8080
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: WEB_URL
        sync: false # Set this to your frontend URL after deployment
      - key: SERVER_URL
        sync: false # Set this to your backend URL after deployment
      - key: DATABASE_URL
        fromDatabase:
          name: enterprise-ai-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: enterprise-ai-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: enterprise-ai-db
          property: password

databases:
  - name: enterprise-ai-db
    databaseName: enterprise_ai
    plan: free
