spring.application.name=demo

# ============================================
# LLM Provider Configuration
# ============================================
# Set to "openai" to use OpenAI API (default)
# Set to "lmstudio" to use local LM Studio
app.llm.provider=${LLM_PROVIDER:lmstudio}

# ============================================
# OpenAI Configuration (used when app.llm.provider=openai)
# ============================================
#spring.ai.openai.api-key=${OPENAI_API_KEY}
#spring.ai.openai.chat.options.model=gpt-4-mini
# spring.ai.openai.base-url=https://api.openai.com/v1

# ============================================
# LM Studio Configuration (used when app.llm.provider=lmstudio)
# ============================================
# Default to localhost for local development; override LM_STUDIO_URL if needed
spring.ai.openai.base-url=${LM_STUDIO_URL:http://localhost:1234}
# LM Studio doesn't require an API key, but Spring AI expects one
# You can use a dummy value like "not-needed" or any placeholder
spring.ai.openai.api-key=${OPENAI_API_KEY:not-needed}
spring.ai.openai.chat.options.model=local-model

# ============================================
# Server Configuration
# ============================================
server.port=8080
management.endpoints.web.exposure.include=*

# ============================================
# CORS Configuration
# ============================================
# Frontend URL for CORS (empty defaults to localhost origins)
web.url=${WEB_URL:}

# ============================================
# File Upload Configuration
# ============================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# ============================================
# Database Configuration
# ============================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/enterprise_ai}
spring.datasource.username=${DATABASE_USERNAME:workspace}
spring.datasource.password=${DATABASE_PASSWORD:changeme}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# When Hibernate cannot access JDBC metadata at startup (e.g. DB not available during tests
# or runtime), explicitly set the dialect to avoid the "Unable to determine Dialect"
# error. Adjust if you target a specific Postgres version (PostgreSQL10Dialect, etc.).
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================
# Flyway Database Migration Configuration
# ============================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=true



# RAG / Re-ranker defaults
app.rag.vectorTopK=20
app.rag.finalTopN=5
app.reranker.strategy=embedding
app.reranker.maxCandidates=50

# Phase 2: Hybrid Search Configuration
app.rag.enableHybridSearch=true
app.rag.keywordTopK=20
app.rag.rrfK=60

# Phase 3: Query Rewriting Configuration
app.rag.enableQueryRewriting=false

# Phase 4: Context Compression Configuration
app.rag.enableContextCompression=false
app.rag.compressionSentenceCount=5

# Phase 5: Multi-Document Retrieval Configuration
app.rag.enableMultiDocumentMode=false

# ============================================
# Phase 6: UI Configuration (Thymeleaf)
# ============================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8


# ============================================
# Swagger/OpenAPI Configuration
# ============================================
# Enable Swagger UI at http://localhost:8080/swagger-ui.html
# Enable OpenAPI JSON at http://localhost:8080/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Customize Swagger UI appearance
springdoc.swagger-ui.doc-expansion=list
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true

# ============================================
# Logging Configuration
# ============================================
logging.level.root=INFO
logging.level.com.enterprise.ai.knowledge.assistant=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.ai=INFO
logging.level.org.hibernate.SQL=INFO
logging.config=classpath:logback-spring.xml

# ============================================
# Enhanced Logging Configuration
# ============================================
# Performance logging threshold in milliseconds - operations taking longer than this will be logged as warnings
app.logging.performance.threshold=1000

# Enable audit logging for sensitive operations
app.logging.audit.enabled=true

# JSON logging configuration (auto-detected based on spring profile)
# Use -Dspring.profiles.active=prod for JSON logging in production

