spring.application.name=demo

# ============================================
# Local Development Configuration
# ============================================
# This profile is activated when running locally (SPRING_PROFILES_ACTIVE=local)

# ============================================
# LLM Provider Configuration
# ============================================
# Use LM Studio by default for local development
# Set OPENAI_API_KEY environment variable to use OpenAI instead
app.llm.provider=${LLM_PROVIDER:lmstudio}

# ============================================
# LM Studio Configuration (default for local)
# ============================================
spring.ai.openai.base-url=${LM_STUDIO_URL:http://localhost:1234}
spring.ai.openai.api-key=${OPENAI_API_KEY:not-needed}
spring.ai.openai.chat.options.model=local-model

# ============================================
# OpenAI Configuration (when using OpenAI)
# ============================================
# Uncomment and set OPENAI_API_KEY environment variable to use OpenAI
# spring.ai.openai.api-key=${OPENAI_API_KEY}
# spring.ai.openai.chat.options.model=gpt-4o-mini
# spring.ai.openai.embedding.options.model=text-embedding-3-small
# spring.ai.openai.embedding.options.dimensions=768
# spring.ai.openai.base-url=https://api.openai.com/v1

# ============================================
# Database Configuration (Local PostgreSQL)
# ============================================
# Override with environment variables for different local DB setup
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/enterprise_ai}
spring.datasource.username=${DATABASE_USERNAME:workspace}
spring.datasource.password=${DATABASE_PASSWORD:changeme}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================
# Server Configuration
# ============================================
server.port=${PORT:8080}

# ============================================
# CORS Configuration
# ============================================
# Frontend URL for CORS (empty defaults to localhost origins)
web.url=${WEB_URL:}

# ============================================
# RAG / Re-ranker defaults
# ============================================
app.rag.vectorTopK=20
app.rag.finalTopN=3
app.reranker.strategy=embedding
app.reranker.maxCandidates=50

