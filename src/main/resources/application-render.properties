spring.application.name=demo

# ============================================
# Render Deployment Configuration
# ============================================
# This profile is activated when running on Render (SPRING_PROFILES_ACTIVE=render)

# ============================================
# LLM Provider Configuration
# ============================================
# Use OpenAI for Render (requires OPENAI_API_KEY environment variable)
app.llm.provider=${LLM_PROVIDER:-openai}

# ============================================
# OpenAI Configuration
# ============================================
# API key must be set as a Render environment variable named OPENAI_API_KEY
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:-gpt-4o-mini}
spring.ai.openai.embedding.options.model=text-embedding-ada-002
spring.ai.openai.base-url=${OPENAI_BASE_URL:-https://api.openai.com/v1}

# ============================================
# Database Configuration (Render PostgreSQL)
# ============================================
# Use Render's internal database URL format
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================
# Server Configuration
# ============================================
# Render provides PORT environment variable
server.port=${PORT:-8080}

# ============================================
# Swagger/OpenAPI Configuration
# ============================================
# Server URL for Swagger UI (set via SERVER_URL environment variable)
server.url=${SERVER_URL:-https://your-app.onrender.com}

# ============================================
# CORS Configuration
# ============================================
# Frontend URL for CORS (set via WEB_URL environment variable)
web.url=${WEB_URL:-https://your-frontend.onrender.com}

# ============================================
# RAG / Re-ranker defaults
# ============================================
app.rag.vectorTopK=20
app.rag.finalTopN=3
app.reranker.strategy=embedding
app.reranker.maxCandidates=50

# ============================================
# Phase 2: Hybrid Search Configuration
# ============================================
app.rag.enableHybridSearch=true
app.rag.keywordTopK=20
app.rag.rrfK=60

# ============================================
# Phase 3: Query Rewriting Configuration
# ============================================
app.rag.enableQueryRewriting=false

# ============================================
# Phase 4: Context Compression Configuration
# ============================================
app.rag.enableContextCompression=false
app.rag.compressionSentenceCount=5

# ============================================
# Phase 5: Multi-Document Retrieval Configuration
# ============================================
app.rag.enableMultiDocumentMode=false

# ============================================
# UI Configuration (Thymeleaf)
# ============================================
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ============================================
# Swagger/OpenAPI Configuration
# ============================================
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ============================================
# Logging Configuration
# ============================================
logging.level.root=INFO
logging.level.com.enterprise.ai.knowledge.assistant=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.ai=INFO
logging.level.org.hibernate.SQL=INFO
logging.config=classpath:logback-spring.xml

# ============================================
# Enhanced Logging Configuration
# ============================================
# Performance logging threshold in milliseconds - operations taking longer than this will be logged as warnings
app.logging.performance.threshold=1000

# Enable audit logging for sensitive operations
app.logging.audit.enabled=true

# JSON logging configuration (auto-detected based on spring profile)
# Use -Dspring.profiles.active=prod for JSON logging in production

